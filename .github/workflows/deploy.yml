name: "application is live at http://203.161.38.194:8082/"

on:
  push:
    branches:
      - docker-master-ratim # Trigger the deployment when code is pushed to the 'docker-master-ratim' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub
      - name: Checkout the code
        uses: actions/checkout@v2

      # Step 2: Set up the SSH agent to authenticate with the server
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Debugging Step: Test SSH connection with verbose output
      - name: Test SSH connection
        run: ssh -vvv -o StrictHostKeyChecking=no root@203.161.38.194 echo "Connection successful"

      # Step 3: Copy the application code to the correct directory on the server using rsync
      - name: Copy files to the server
        run: |
          ssh -o StrictHostKeyChecking=no root@203.161.38.194 'mkdir -p /home/fastapi/docker-master-ratim-lms-backend'
          rsync -avz --exclude '.git' --exclude 'node_modules' ./ root@203.161.38.194:/home/fastapi/docker-master-ratim-lms-backend/

      # Step 4: SSH into the server and deploy the updated application
      - name: Deploy the application
        run: |
          ssh -o StrictHostKeyChecking=no root@203.161.38.194 << 'EOF'
            set -e
            cd /home/fastapi/docker-master-ratim-lms-backend

            echo "Deploying application..."
            docker-compose down
            docker-compose up -d --build

            echo "Waiting for services to initialize..."
            sleep 30

            check_service() {
              local service=$1
              echo "Checking $service..."
              
              if docker-compose ps $service | grep -q "Up"; then
                echo "$service is running."
              else
                echo "ERROR: $service is not running!"
                docker-compose logs $service | tail -n 50
                return 1
              fi
              
              if docker-compose logs $service | grep -iq "error"; then
                echo "WARNING: Found errors in $service logs:"
                docker-compose logs $service | grep -i "error" | tail -n 10
              fi
              
              return 0
            }

            services=("web" "db" "pgadmin" "nginx")
            failed=false

            for service in "${services[@]}"; do
              if ! check_service $service; then
                failed=true
              fi
            done

            if $failed; then
              echo "Deployment failed. Check the logs above for details."
              exit 1
            else
              echo "Deployment successful!"
            fi
          EOF
